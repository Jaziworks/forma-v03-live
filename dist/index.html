<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forma — 3D lettering studio</title><meta name="description" content="Sculpt a form. Wrap it in words. Paint in three dimensions."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23272525'/%3E%3Cpath d='M9 25V7h15M9 15h11' fill='none' stroke='%23faf8f3' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#" aria-label="Jazi studio"><img src="jazi-logo.svg" alt="Jazi" class="header-logo"><span class="studio">FORMA</span></a><div class="project-name">Untitled study <span class="tag">LOCAL</span></div><div class="header-actions"><button id="openProject">Open</button><button id="saveProject">Save project</button><button class="primary" id="openExport">Export <span>↗</span></button></div></header>
<main><aside class="left"><nav class="tabs" aria-label="Editing tools"><button data-tab="shape" class="active"><span>◒</span> Shape</button><button data-tab="text"><span>T</span> Text</button><button data-tab="paint"><span>⌁</span> Paint</button><button data-tab="scene"><span>◈</span> Scene</button></nav><div id="settings"></div></aside>
<section class="workspace"><div class="workspace-top"><div><span class="dot"></span> <span id="workTitle">Vase study</span><span class="muted"> / 01</span></div><div class="history"><button id="compositionToggle" aria-expanded="false" aria-controls="compositionPanel">Layers</button><button id="undo" title="Undo (⌘Z)" aria-label="Undo">↶</button><button id="redo" title="Redo (⌘⇧Z)" aria-label="Redo">↷</button><span class="divider"></span><button id="help" title="Show shortcuts" aria-label="Help">?</button></div></div><div class="stage-wrap"><div id="stage"><div id="canvas"></div></div><div class="floating-tools"><button id="orbitTool" class="selected" title="Move the view" aria-label="Move the view">Move</button><button id="brushTool" title="Paint on the surface" aria-label="Paint">Paint</button><span></span><button id="frontView">Front</button><button id="sideView">Side</button><button id="topView">Top</button><button id="resetView" title="Reset view" aria-label="Reset view">⛶</button></div></div><div class="workspace-bottom"><span id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</span><span id="zoomReadout">PERSPECTIVE</span></div></section>
<aside class="right" id="compositionPanel" aria-label="Composition"><div class="panel-heading">Composition <button id="addObject" title="Add another form" aria-label="Add form">+</button></div><div id="layers"></div><div class="section-rule"></div><div class="panel-heading">Quick view</div><label class="switch-row">Show solid form <input type="checkbox" id="solidToggle"></label><label class="switch-row">Show lettering <input type="checkbox" id="textToggle" checked></label><label class="switch-row">Show painting <input type="checkbox" id="paintToggle" checked></label><label class="switch-row">Rear strokes <input type="checkbox" id="rearToggle"></label><div class="section-rule"></div><div class="panel-heading">Background <input id="background" type="color" value="#171918" aria-label="Background color"></div><div class="swatches"><button data-bg="#171918" style="--swatch:#171918" aria-label="Charcoal background"></button><button data-bg="#efece5" style="--swatch:#efece5" aria-label="Paper background"></button><button data-bg="#deddd5" style="--swatch:#deddd5" aria-label="Stone background"></button><button data-bg="#a3b5c2" style="--swatch:#a3b5c2" aria-label="Blue background"></button><button data-bg="#724b40" style="--swatch:#724b40" aria-label="Clay background"></button></div></aside></main>
<div id="toast" role="status" aria-live="polite"></div><dialog id="exportDialog"><div class="dialog-head"><div><div class="eyebrow">TAKE IT WITH YOU</div><h2>Export your study.</h2></div><button id="closeExport" aria-label="Close">×</button></div><div class="export-grid"><label>Format<select id="exportFormat"><option value="png">PNG · Image</option><option value="jpeg">JPEG · Image</option><option value="svg">SVG · Vector lines</option><option value="glb">GLB · 3D scene</option><option value="psd">PSD · Raster layers</option><option value="video">WebM / MP4 · Turntable</option></select></label><label>Resolution<select id="resolution"><option value="2048">2048 px</option><option value="4096">4096 px</option><option value="1024">1024 px</option></select></label><label>Duration<select id="duration"><option value="6">6 seconds</option><option value="12">12 seconds</option><option value="3">3 seconds</option></select></label><label>Frame rate<select id="fps"><option>30</option><option>60</option><option>24</option></select></label></div><label class="switch-row">Transparent background<input id="transparent" type="checkbox"></label><label class="switch-row">Include solid forms<input id="exportSolid" type="checkbox"></label><p id="exportNote" class="note"></p><button id="exportNow" class="primary wide">Export PNG ↗</button><progress id="exportProgress" max="1" value="0" hidden></progress></dialog><input id="modelFile" type="file" accept=".stl,.obj,.glb,.gltf,.bin,.png,.jpg,.jpeg" multiple hidden><input id="projectFile" type="file" accept=".formline,.json" hidden><input id="fontFile" type="file" accept=".ttf,.otf,.woff" hidden><script src="app.js"></script></body></html>
